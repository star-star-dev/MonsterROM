name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        # Isolated validation branch: build only Galaxy Note10+ 5G Korea (d2xks).
        target: [d2xks]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          # Deliberately no Actions cache: builds must not create chargeable cache storage.

      # Do not cache the large S26+ source firmware. Keep one combined cache only:
      # the d2xks target Odin directory plus compiled build tools. The combined
      # uncompressed payload is checked against an 8 GiB ceiling, leaving margin
      # below GitHub's 10 GiB repository allowance and avoiding extra cache cost.
      - name: Restore d2xks build cache
        id: d2xks-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            out/odin/SM-N976N_KOO
            out/tools
          key: d2xks-build-v2-N976NKSU2HWH5-N976NOKR2HWH5-N976NKOU2HWH3

      - name: Build dependencies
        if: steps.d2xks-build-cache.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh

      - name: Check d2xks build cache size
        id: d2xks-build-cache-size
        run: |
          set -euo pipefail
          target_dir=out/odin/SM-N976N_KOO
          tools_dir=out/tools
          max_bytes=$((8 * 1024 * 1024 * 1024))
          target_bytes=$(du -sb "$target_dir" | cut -f1)
          tools_bytes=$(du -sb "$tools_dir" | cut -f1)
          actual_bytes=$((target_bytes + tools_bytes))
          echo "Combined d2xks cache candidate: ${actual_bytes} bytes (limit: ${max_bytes})"
          echo "bytes=${actual_bytes}" >> "$GITHUB_OUTPUT"
          if [ "$actual_bytes" -le "$max_bytes" ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "Combined cache exceeds the free-safe limit; cache save disabled."
          fi

      - name: Save d2xks build cache
        if: steps.d2xks-build-cache.outputs.cache-hit != 'true' && steps.d2xks-build-cache-size.outputs.save == 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            out/odin/SM-N976N_KOO
            out/tools
          key: d2xks-build-v2-N976NKSU2HWH5-N976NOKR2HWH5-N976NKOU2HWH3

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --build-rom-zip

      # Match ArtisanROM's release convention: split the flashable ROM into
      # six GitHub Release assets, each below GitHub's per-asset limit.
      - name: Split ROM and upload GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No flashable ROM ZIP found in out/"
            exit 1
          fi
          mkdir -p release_parts
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            sha256sum "$file" > "${file}.sha256"
            split -d -n 6 --additional-suffix="" "$file" "release_parts/${name}.part_"
            cp "${file}.sha256" "release_parts/"
          done
          tag="d2xks-oneui8.5-final"
          title="MonsterROM d2xks OneUI8.5 final"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          release_json="release.json"
          release_code=$(curl -sS -L "${auth[@]}" -o "$release_json" -w "%{http_code}" "$api/releases/tags/$tag")
          if [ "$release_code" = "200" ]; then
            release_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$release_json")
          elif [ "$release_code" = "404" ]; then
            python3 - "$tag" "$title" "$GITHUB_SHA" > release_payload.json <<'PY'
          import json, sys
          print(json.dumps({
              "tag_name": sys.argv[1],
              "target_commitish": sys.argv[3],
              "name": sys.argv[2],
              "body": "Samsung Galaxy Note10+ 5G KOR (d2xks / SM-N976N), OneUI8.5 donor. Reassemble the six .part_ files in lexical order with cat, then verify the accompanying SHA-256 file before flashing.",
              "draft": False,
              "prerelease": False,
          }))
          PY
            curl -sS -f -L -X POST "${auth[@]}" -H "Content-Type: application/json" --data-binary @release_payload.json "$api/releases" > "$release_json"
            release_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$release_json")
          else
            cat "$release_json"
            exit 1
          fi
          upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
          for asset in release_parts/*; do
            asset_name=$(basename "$asset")
            encoded_name=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$asset_name")
            curl -sS -f -L --retry 3 -X POST "${auth[@]}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_url?name=$encoded_name" > /dev/null
          done
          curl -sS -f -L "${auth[@]}" "$api/releases/$release_id" > release_verify.json
          python3 - <<'PY'
          import json
          release = json.load(open("release_verify.json"))
          parts = sorted(a["name"] for a in release.get("assets", []) if ".part_" in a["name"])
          if len(parts) != 6:
              raise SystemExit(f"expected 6 ROM parts, found {len(parts)}: {parts}")
          print(f"Release verified: {release['name']} with six ROM parts")
          PY
          rm -f "$release_json" release_payload.json release_verify.json
